<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Speedrun Tracker</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 900px;
    }
    .card {
      background: #1e293b;
      padding: 1.5rem;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
      margin-bottom: 20px;
    }
    h1, h2, h3, h4 { margin-top: 0; }
    input, select {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border-radius: 6px;
      border: 1px solid #334155;
      background: #0f172a;
      color: white;
      box-sizing: border-box;
    }
    button {
      padding: 10px 16px;
      border-radius: 6px;
      border: none;
      background: #3b82f6;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover { background: #2563eb; }
    .btn-danger { background: #ef4444; }
    .btn-danger:hover { background: #dc2626; }
    .btn-success { background: #22c55e; }
    .btn-success:hover { background: #16a34a; }
    .secondary-btn { background: #475569; }
    .secondary-btn:hover { background: #334155; }
    .btn-sm { padding: 5px 10px; font-size: 0.85rem; }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }
    .badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 0.8rem;
      font-weight: bold;
      background: #3b82f6;
    }
    .badge-admin { background: #eab308; color: black; }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }
    th, td {
      text-align: left;
      padding: 10px;
      border-bottom: 1px solid #334155;
    }
    th { color: #94a3b8; }
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }
    .hidden { display: none; }
    .pending-item {
      background: #0f172a;
      border: 1px solid #334155;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }
  </style>
</head>
<body>

<div class="container">

  <!-- VUE AUTHENTIFICATION (CONNEXION & INSCRIPTION) -->
  <div class="card" id="authSection" style="max-width: 400px; margin: 60px auto; text-align: center;">
    <h1>⏱️ Speedrun Tracker</h1>
    <input type="text" id="username" placeholder="Pseudo du joueur" autocomplete="username" />
    <input type="password" id="password" placeholder="Mot de passe (6 car. min)" autocomplete="current-password" />
    
    <button style="width: 100%; margin-top: 10px;" onclick="login()">Se connecter</button>
    <button class="secondary-btn" style="width: 100%; margin-top: 8px;" onclick="signUp()">Créer un compte</button>
    
    <div id="authMsg" style="margin-top: 12px; font-size: 0.9rem;"></div>
  </div>

  <!-- VUE PRINCIPALE -->
  <div id="appSection" class="hidden">
    <div class="header">
      <div>
        <h2 style="display: inline-block; margin: 0;" id="userGreeting">Bienvenue</h2>
        <span id="userRoleBadge" class="badge"></span>
      </div>
      <button class="secondary-btn" onclick="logout()">Déconnexion</button>
    </div>

    <!-- PANNEAU ADMINISTRATEUR -->
    <div class="card hidden" id="adminPanel" style="border: 1px solid #eab308;">
      <h3 style="color: #eab308;">👑 Panneau Administrateur</h3>

      <!-- GESTION DES JEUX ET CATÉGORIES -->
      <div class="grid-2">
        <div>
          <h4>Ajouter un jeu</h4>
          <input type="text" id="newGameTitle" placeholder="Ex: Super Mario 64" />
          <button onclick="addGame()">Créer le jeu</button>
        </div>
        <div>
          <h4>Ajouter une catégorie</h4>
          <select id="gameSelectForCategory"></select>
          <input type="text" id="newCategoryName" placeholder="Ex: Any%, 100%" />
          <button onclick="addCategory()">Créer la catégorie</button>
        </div>
      </div>

      <hr style="border: none; border-top: 1px solid #334155; margin: 20px 0;" />

      <!-- LISTE D'ATTENTE DES RUNS -->
      <h4>⏳ Runs en attente de vérification</h4>
      <div id="pendingRunsList">Chargement des runs en attente...</div>
    </div>

    <!-- SOUMETTRE UN TEMPS (JOUEURS & ADMIN) -->
    <div class="card">
      <h3>🚀 Soumettre un chrono</h3>

      <!-- SÉLECTION JOUEUR (VISIBLE UNIQUEMENT POUR L'ADMIN) -->
      <div id="adminPlayerSelectContainer" class="hidden" style="margin-bottom: 12px; background: #0f172a; padding: 12px; border-radius: 8px; border: 1px solid #eab308;">
        <label style="color: #eab308; font-weight: bold;">👑 Soumettre pour le joueur :</label>
        <select id="targetPlayerSelect"></select>
        <label style="display: flex; align-items: center; gap: 8px; margin-top: 8px; cursor: pointer; font-size: 0.9rem;">
          <input type="checkbox" id="adminAutoApprove" checked style="width: auto; margin: 0;" />
          Valider immédiatement dans le classement (ne pas mettre en attente)
        </label>
      </div>

      <div class="grid-2">
        <div>
          <label>Jeu :</label>
          <select id="runGameSelect" onchange="loadCategoriesForRun()"></select>
        </div>
        <div>
          <label>Catégorie :</label>
          <select id="runCategorySelect"></select>
        </div>
      </div>
      <div class="grid-2" style="margin-top: 10px;">
        <div>
          <label>Temps (format <code>MM:SS.ms</code> ex: <code>01:24.500</code>) :</label>
          <input type="text" id="runTimeString" placeholder="00:00.000" />
        </div>
        <div>
          <label>Lien de la preuve (YouTube) :</label>
          <input type="url" id="runProof" placeholder="https://youtube.com/..." />
        </div>
      </div>
      <button style="margin-top: 12px;" onclick="submitRun()">Envoyer le chrono</button>
      <div id="runMsg" style="margin-top: 8px; font-size: 0.9rem;"></div>
    </div>

    <!-- CLASSEMENT OFFICIEL AVEC FILTRES -->
    <div class="card">
      <h3>🏆 Classement officiel</h3>
      <div class="grid-2">
        <div>
          <label>Filtrer par Jeu :</label>
          <select id="filterGameSelect" onchange="onFilterGameChange()">
            <option value="all">Tous les jeux</option>
          </select>
        </div>
        <div>
          <label>Filtrer par Catégorie :</label>
          <select id="filterCategorySelect" onchange="renderLeaderboard()">
            <option value="all">Toutes les catégories</option>
          </select>
        </div>
      </div>

      <table>
        <thead>
          <tr>
            <th>Rang</th>
            <th>Jeu</th>
            <th>Catégorie</th>
            <th>Joueur</th>
            <th>Temps</th>
            <th>Preuve</th>
            <th id="adminActionTh" class="hidden">Actions Admin</th>
          </tr>
        </thead>
        <tbody id="leaderboardBody">
          <tr><td colspan="7">Chargement des scores...</td></tr>
        </tbody>
      </table>
    </div>

  </div>

</div>

<script>
  const SUPABASE_URL = "https://xvienxfcxunlyvejmnzv.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_VBWF6RKzyWLt0L1ANK9dAA_zZofxYi0";
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    auth: {
      persistSession: true,
      autoRefreshToken: true
    }
  });

  let currentUser = null;
  let currentProfile = null;
  let allGames = [];
  let allCategories = [];
  let allProfiles = [];
  let verifiedRuns = [];

  // Vérifier la session existante au chargement
  window.addEventListener('DOMContentLoaded', async () => {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (session && session.user) {
      currentUser = session.user;
      await initApp();
    }
  });

  function parseTimeToSeconds(timeStr) {
    if (!timeStr) return null;
    const parts = timeStr.trim().split(':');
    if (parts.length === 2) {
      const min = parseFloat(parts[0]);
      const sec = parseFloat(parts[1]);
      if (isNaN(min) || isNaN(sec)) return null;
      return (min * 60) + sec;
    } else if (parts.length === 3) {
      const h = parseFloat(parts[0]);
      const min = parseFloat(parts[1]);
      const sec = parseFloat(parts[2]);
      if (isNaN(h) || isNaN(min) || isNaN(sec)) return null;
      return (h * 3600) + (min * 60) + sec;
    } else {
      const sec = parseFloat(timeStr);
      return isNaN(sec) ? null : sec;
    }
  }

  function formatSecondsToTime(totalSec) {
    if (totalSec == null || isNaN(totalSec)) return '-';
    const hours = Math.floor(totalSec / 3600);
    const minutes = Math.floor((totalSec % 3600) / 60);
    const seconds = totalSec % 60;

    const minStr = String(minutes).padStart(2, '0');
    const secStr = seconds.toFixed(3).padStart(6, '0');

    if (hours > 0) {
      const hStr = String(hours).padStart(2, '0');
      return `${hStr}:${minStr}:${secStr}`;
    }
    return `${minStr}:${secStr}`;
  }

  function pseudoToEmail(pseudo) {
    const clean = pseudo.trim().toLowerCase().replace(/[^a-z0-9_-]/g, '');
    return `${clean}@speedrun.com`;
  }

  // Connexion
  async function login() {
    const pseudo = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    const msg = document.getElementById('authMsg');

    if (!pseudo || !password) {
      msg.style.color = '#ef4444';
      msg.innerText = "Remplis ton pseudo et ton mot de passe.";
      return;
    }

    const { data, error } = await supabaseClient.auth.signInWithPassword({
      email: pseudoToEmail(pseudo),
      password
    });

    if (error) {
      msg.style.color = '#ef4444';
      msg.innerText = "Pseudo ou mot de passe incorrect.";
    } else {
      currentUser = data.user;
      await initApp();
    }
  }

  // Inscription
  async function signUp() {
    const pseudo = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    const msg = document.getElementById('authMsg');

    if (!pseudo || !password) {
      msg.style.color = '#ef4444';
      msg.innerText = "Remplis le pseudo et le mot de passe.";
      return;
    }

    if (password.length < 6) {
      msg.style.color = '#ef4444';
      msg.innerText = "Le mot de passe doit comporter au moins 6 caractères.";
      return;
    }

    const email = pseudoToEmail(pseudo);

    const { data, error } = await supabaseClient.auth.signUp({
      email,
      password,
      options: {
        data: { username: pseudo }
      }
    });

    if (error) {
      msg.style.color = '#ef4444';
      msg.innerText = error.message;
    } else {
      // Auto-connexion directe après création
      currentUser = data.user;
      const { data: signInData, error: signInErr } = await supabaseClient.auth.signInWithPassword({
        email,
        password
      });

      if (!signInErr && signInData?.user) {
        currentUser = signInData.user;
        await initApp();
      } else {
        msg.style.color = '#22c55e';
        msg.innerText = `Compte créé pour ${pseudo} ! Tu peux cliquer sur Se connecter.`;
      }
    }
  }

  async function logout() {
    await supabaseClient.auth.signOut();
    location.reload();
  }

  async function initApp() {
    document.getElementById('authSection').classList.add('hidden');
    document.getElementById('appSection').classList.remove('hidden');

    const { data: profile } = await supabaseClient
      .from('profiles')
      .select('*')
      .eq('id', currentUser.id)
      .single();

    currentProfile = profile || { username: 'Joueur', role: 'player' };

    document.getElementById('userGreeting').innerText = `Bonjour, ${currentProfile.username}`;
    const badge = document.getElementById('userRoleBadge');
    badge.innerText = currentProfile.role.toUpperCase();

    if (currentProfile.role === 'admin') {
      badge.classList.add('badge-admin');
      document.getElementById('adminPanel').classList.remove('hidden');
      document.getElementById('adminActionTh').classList.remove('hidden');
      document.getElementById('adminPlayerSelectContainer').classList.remove('hidden');
      await loadProfilesList();
      await loadPendingRuns();
    }

    await loadGamesAndCategories();
    await fetchLeaderboard();
  }

  async function loadProfilesList() {
    const { data } = await supabaseClient.from('profiles').select('id, username').order('username');
    allProfiles = data || [];
    const select = document.getElementById('targetPlayerSelect');
    select.innerHTML = '';
    allProfiles.forEach(p => {
      const isCurrent = p.id === currentUser.id ? 'selected' : '';
      select.innerHTML += `<option value="${p.id}" ${isCurrent}>${p.username} ${p.id === currentUser.id ? '(Moi)' : ''}</option>`;
    });
  }

  async function loadGamesAndCategories() {
    const { data: games } = await supabaseClient.from('games').select('*').order('title');
    const { data: categories } = await supabaseClient.from('categories').select('*');

    allGames = games || [];
    allCategories = categories || [];

    const gameSelectAdmin = document.getElementById('gameSelectForCategory');
    const gameSelectRun = document.getElementById('runGameSelect');
    const filterGameSelect = document.getElementById('filterGameSelect');

    gameSelectAdmin.innerHTML = '';
    gameSelectRun.innerHTML = '<option value="">Sélectionner un jeu</option>';
    filterGameSelect.innerHTML = '<option value="all">Tous les jeux</option>';

    allGames.forEach(g => {
      gameSelectAdmin.innerHTML += `<option value="${g.id}">${g.title}</option>`;
      gameSelectRun.innerHTML += `<option value="${g.id}">${g.title}</option>`;
      filterGameSelect.innerHTML += `<option value="${g.id}">${g.title}</option>`;
    });

    loadCategoriesForRun();
    onFilterGameChange();
  }

  function loadCategoriesForRun() {
    const gameId = document.getElementById('runGameSelect').value;
    const catSelect = document.getElementById('runCategorySelect');
    catSelect.innerHTML = '';
    const filtered = allCategories.filter(c => c.game_id == gameId);
    filtered.forEach(c => {
      catSelect.innerHTML += `<option value="${c.id}">${c.name}</option>`;
    });
  }

  function onFilterGameChange() {
    const gameId = document.getElementById('filterGameSelect').value;
    const catSelect = document.getElementById('filterCategorySelect');
    catSelect.innerHTML = '<option value="all">Toutes les catégories</option>';

    if (gameId !== 'all') {
      const filtered = allCategories.filter(c => c.game_id == gameId);
      filtered.forEach(c => {
        catSelect.innerHTML += `<option value="${c.id}">${c.name}</option>`;
      });
    }
    renderLeaderboard();
  }

  async function addGame() {
    const title = document.getElementById('newGameTitle').value.trim();
    if (!title) return;
    await supabaseClient.from('games').insert([{ title }]);
    document.getElementById('newGameTitle').value = '';
    await loadGamesAndCategories();
  }

  async function addCategory() {
    const game_id = document.getElementById('gameSelectForCategory').value;
    const name = document.getElementById('newCategoryName').value.trim();
    if (!game_id || !name) return;
    await supabaseClient.from('categories').insert([{ game_id, name }]);
    document.getElementById('newCategoryName').value = '';
    await loadGamesAndCategories();
  }

  async function submitRun() {
    const category_id = document.getElementById('runCategorySelect').value;
    const timeInput = document.getElementById('runTimeString').value;
    const proof_url = document.getElementById('runProof').value.trim();
    const msg = document.getElementById('runMsg');

    const time_seconds = parseTimeToSeconds(timeInput);

    if (!category_id || time_seconds === null || time_seconds <= 0) {
      msg.style.color = '#ef4444';
      msg.innerText = "Format invalide. Utilise MM:SS.ms (ex: 01:23.450)";
      return;
    }

    let targetUserId = currentUser.id;
    let status = 'pending';

    if (currentProfile && currentProfile.role === 'admin') {
      const selectedId = document.getElementById('targetPlayerSelect').value;
      if (selectedId) targetUserId = selectedId;
      const autoApprove = document.getElementById('adminAutoApprove').checked;
      status = autoApprove ? 'verified' : 'pending';
    }

    const { error } = await supabaseClient.from('runs').insert([{
      user_id: targetUserId,
      category_id,
      time_seconds,
      proof_url,
      status
    }]);

    if (error) {
      msg.style.color = '#ef4444';
      msg.innerText = error.message;
    } else {
      msg.style.color = '#22c55e';
      msg.innerText = status === 'verified' 
        ? "Chrono ajouté et validé directement dans le classement !" 
        : "Chrono envoyé ! En attente de validation.";
      document.getElementById('runTimeString').value = '';
      document.getElementById('runProof').value = '';
      if (currentProfile.role === 'admin') {
        loadPendingRuns();
        fetchLeaderboard();
      }
    }
  }

  async function editRun(runId, currentSeconds) {
    const currentFormatted = formatSecondsToTime(currentSeconds);
    const newTime = prompt("Modifier le chrono (format MM:SS.ms) :", currentFormatted);
    if (!newTime) return;

    const parsed = parseTimeToSeconds(newTime);
    if (parsed === null || parsed <= 0) {
      alert("Format invalide.");
      return;
    }

    const { error } = await supabaseClient
      .from('runs')
      .update({ time_seconds: parsed })
      .eq('id', runId);

    if (error) {
      alert("Erreur lors de la modification : " + error.message);
    } else {
      await fetchLeaderboard();
    }
  }

  async function deleteRun(runId) {
    if (!confirm("Voulez-vous vraiment supprimer ce temps ?")) return;
    const { error } = await supabaseClient.from('runs').delete().eq('id', runId);
    if (!error) await fetchLeaderboard();
  }

  async function fetchLeaderboard() {
    const { data: runs } = await supabaseClient
      .from('runs')
      .select(`
        id,
        time_seconds,
        proof_url,
        category_id,
        categories ( id, name, game_id, games ( id, title ) ),
        profiles ( username )
      `)
      .eq('status', 'verified')
      .order('time_seconds', { ascending: true });

    verifiedRuns = runs || [];
    renderLeaderboard();
  }

  function renderLeaderboard() {
    const gameFilter = document.getElementById('filterGameSelect').value;
    const catFilter = document.getElementById('filterCategorySelect').value;
    const tbody = document.getElementById('leaderboardBody');
    const isAdmin = currentProfile?.role === 'admin';

    let filtered = verifiedRuns.filter(r => {
      const matchesGame = (gameFilter === 'all') || (r.categories?.games?.id == gameFilter);
      const matchesCat = (catFilter === 'all') || (r.categories?.id == catFilter);
      return matchesGame && matchesCat;
    });

    tbody.innerHTML = '';

    if (filtered.length === 0) {
      tbody.innerHTML = `<tr><td colspan="${isAdmin ? 7 : 6}">Aucun score pour cette sélection.</td></tr>`;
      return;
    }

    filtered.forEach((r, index) => {
      let rankIcon = `#${index + 1}`;
      if (index === 0) rankIcon = '🥇 1er';
      if (index === 1) rankIcon = '🥈 2e';
      if (index === 2) rankIcon = '🥉 3e';

      tbody.innerHTML += `
        <tr>
          <td><strong>${rankIcon}</strong></td>
          <td>${r.categories?.games?.title || '-'}</td>
          <td>${r.categories?.name || '-'}</td>
          <td><strong>${r.profiles?.username || 'Anonyme'}</strong></td>
          <td style="font-family: monospace; font-size: 1.05rem; color: #38bdf8;">${formatSecondsToTime(r.time_seconds)}</td>
          <td>${r.proof_url ? `<a href="${r.proof_url}" target="_blank" style="color:#60a5fa; text-decoration: underline;">Voir la vidéo</a>` : '-'}</td>
          ${isAdmin ? `
            <td>
              <button class="btn-sm secondary-btn" onclick="editRun(${r.id}, ${r.time_seconds})">✏️ Éditer</button>
              <button class="btn-sm btn-danger" onclick="deleteRun(${r.id})">🗑️</button>
            </td>
          ` : ''}
        </tr>
      `;
    });
  }

  async function loadPendingRuns() {
    const { data: runs } = await supabaseClient
      .from('runs')
      .select(`
        id,
        time_seconds,
        proof_url,
        categories ( name, games ( title ) ),
        profiles ( username )
      `)
      .eq('status', 'pending')
      .order('created_at', { ascending: true });

    const container = document.getElementById('pendingRunsList');
    container.innerHTML = '';

    if (!runs || runs.length === 0) {
      container.innerHTML = '<p style="color:#94a3b8;">Aucune run en attente de vérification.</p>';
      return;
    }

    runs.forEach(r => {
      const pseudo = r.profiles?.username || 'Inconnu';
      const chrono = formatSecondsToTime(r.time_seconds);
      const gameInfo = `${r.categories?.games?.title || '-'} (${r.categories?.name || '-'})`;
      const proofLink = r.proof_url 
        ? `<a href="${r.proof_url}" target="_blank" style="color:#38bdf8; font-weight:bold; text-decoration:underline;">📺 Voir la vidéo YouTube</a>`
        : '<span style="color:#64748b;">(Aucun lien vidéo fourni)</span>';

      container.innerHTML += `
        <div class="pending-item">
          <div>
            <span style="font-size: 1.05rem;">Joueur : <strong style="color:#f59e0b;">${pseudo}</strong></span>
            &nbsp;|&nbsp;
            <span>Temps : <strong style="color:#38bdf8; font-family:monospace; font-size:1.1rem;">${chrono}</strong></span>
            &nbsp;|&nbsp;
            <span>Jeu : <em>${gameInfo}</em></span>
            <div style="margin-top: 5px;">
              ${proofLink}
            </div>
          </div>
          <div>
            <button class="btn-success" onclick="updateRunStatus(${r.id}, 'verified')">✅ Valider</button>
            <button class="btn-danger" onclick="updateRunStatus(${r.id}, 'rejected')">❌ Rejeter</button>
          </div>
        </div>
      `;
    });
  }

  async function updateRunStatus(runId, status) {
    await supabaseClient.from('runs').update({ status }).eq('id', runId);
    loadPendingRuns();
    await fetchLeaderboard();
  }
</script>
</body>
</html>
