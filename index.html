<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Speedrun Tracker</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: #1e293b;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      width: 100%;
      max-width: 400px;
      text-align: center;
    }
    h1 { margin-bottom: 1.5rem; font-size: 1.5rem; }
    input {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border-radius: 6px;
      border: 1px solid #334155;
      background: #0f172a;
      color: white;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border-radius: 6px;
      border: none;
      background: #3b82f6;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover { background: #2563eb; }
    .secondary-btn { background: #475569; margin-top: 5px; }
    .secondary-btn:hover { background: #334155; }
    #message { margin-top: 15px; font-size: 0.9rem; }
  </style>
</head>
<body>

  <div class="card" id="authCard">
    <h1>⏱️ Speedrun Tracker</h1>
    <input type="text" id="username" placeholder="Pseudo du joueur" autocomplete="username" />
    <input type="password" id="password" placeholder="Mot de passe" autocomplete="current-password" />
    <button onclick="login()">Se connecter</button>
    <button class="secondary-btn" onclick="signUp()">Créer un compte</button>
    <div id="message"></div>
  </div>

  <script>
    // --- TES IDENTIFIANTS SUPABASE ---
    const SUPABASE_URL = "METS_TON_URL_SUPABASE_ICI";
    const SUPABASE_ANON_KEY = "METS_TA_CLE_ANON_ICI";

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Transforme le pseudo en email technique propre (sans espaces, en minuscules)
    function pseudoToEmail(pseudo) {
      const clean = pseudo.trim().toLowerCase().replace(/[^a-z0-9_-]/g, '');
      return `${clean}@speedrun.local`;
    }

    async function signUp() {
      const pseudo = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const msg = document.getElementById('message');

      if (!pseudo || !password) {
        msg.style.color = '#ef4444';
        msg.innerText = "Remplis le pseudo et le mot de passe.";
        return;
      }

      const email = pseudoToEmail(pseudo);

      // On transmet le vrai pseudo dans user_metadata
      const { data, error } = await supabase.auth.signUp({
        email,
        password,
        options: {
          data: { username: pseudo }
        }
      });

      if (error) {
        msg.style.color = '#ef4444';
        msg.innerText = error.message;
      } else {
        msg.style.color = '#22c55e';
        msg.innerText = `Compte créé pour ${pseudo} ! Tu peux te connecter.`;
      }
    }

    async function login() {
      const pseudo = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const msg = document.getElementById('message');

      if (!pseudo || !password) {
        msg.style.color = '#ef4444';
        msg.innerText = "Remplis le pseudo et le mot de passe.";
        return;
      }

      const email = pseudoToEmail(pseudo);

      const { data, error } = await supabase.auth.signInWithPassword({
        email,
        password
      });

      if (error) {
        msg.style.color = '#ef4444';
        msg.innerText = "Pseudo ou mot de passe incorrect.";
      } else {
        const username = data.user.user_metadata?.username || pseudo;
        msg.style.color = '#22c55e';
        msg.innerText = `Connecté en tant que ${username} !`;
      }
    }
  </script>
</body>
</html>
