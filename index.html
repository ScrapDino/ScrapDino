<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Speedrun Tracker</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 900px;
    }
    .card {
      background: #1e293b;
      padding: 1.5rem;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
      margin-bottom: 20px;
    }
    h1, h2, h3, h4 { margin-top: 0; }
    input, select {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border-radius: 6px;
      border: 1px solid #334155;
      background: #0f172a;
      color: white;
      box-sizing: border-box;
    }
    button {
      padding: 10px 16px;
      border-radius: 6px;
      border: none;
      background: #3b82f6;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover { background: #2563eb; }
    .btn-danger { background: #ef4444; }
    .btn-danger:hover { background: #dc2626; }
    .btn-success { background: #22c55e; }
    .btn-success:hover { background: #16a34a; }
    .secondary-btn { background: #475569; }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 0.8rem;
      font-weight: bold;
      background: #3b82f6;
    }
    .badge-admin { background: #eab308; color: black; }
    
    .badge-wr {
      background: #ef4444;
      color: white;
      font-weight: bold;
      padding: 3px 8px;
      border-radius: 4px;
      display: inline-block;
    }
    .badge-btt {
      background: #eab308;
      color: black;
      font-weight: bold;
      padding: 3px 8px;
      border-radius: 4px;
      display: inline-block;
    }

    .row-wr {
      background: rgba(239, 68, 68, 0.22) !important;
      border-left: 5px solid #ef4444;
    }
    .row-btt {
      background: rgba(234, 179, 8, 0.22) !important;
      border-left: 5px solid #eab308;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }
    th, td {
      text-align: left;
      padding: 10px;
      border-bottom: 1px solid #334155;
    }
    th { color: #94a3b8; }
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }
    .hidden { display: none; }
    .radio-group {
      display: flex;
      gap: 20px;
      align-items: center;
      margin: 10px 0;
    }
    .radio-group label {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      font-size: 0.95rem;
    }
    .radio-group input[type="radio"] {
      width: auto;
      margin: 0;
    }
  </style>
</head>
<body>

<div class="container">

  <!-- CONNEXION -->
  <div class="card" id="authSection" style="max-width: 400px; margin: 60px auto;">
    <h1 style="text-align: center;">⏱️ Speedrun Tracker</h1>
    <input type="text" id="username" placeholder="Pseudo du joueur" autocomplete="username" />
    <input type="password" id="password" placeholder="Mot de passe (6 car. min)" autocomplete="current-password" />
    <button style="width: 100%; margin-top: 10px;" onclick="login()">Se connecter</button>
    <div id="authMsg" style="margin-top: 10px; font-size: 0.9rem; text-align: center;"></div>
  </div>

  <!-- APPLICATION -->
  <div id="appSection" class="hidden">
    <div class="header">
      <div>
        <h2 style="display: inline-block; margin: 0;" id="userGreeting">Bonjour</h2>
        <span id="userRoleBadge" class="badge"></span>
      </div>
      <button class="secondary-btn" onclick="logout()">Déconnexion</button>
    </div>

    <!-- PANNEAU ADMIN -->
    <div class="card hidden" id="adminPanel" style="border: 1px solid #eab308;">
      <h3 style="color: #eab308;">👑 Panneau Administrateur</h3>
      <div class="grid-2">
        <div>
          <h4>Ajouter un jeu</h4>
          <input type="text" id="newGameTitle" placeholder="Ex: Shutter" />
          <button onclick="addGame()">Créer le jeu</button>
        </div>
        <div>
          <h4>Ajouter une catégorie</h4>
          <select id="gameSelectForCategory"></select>
          <input type="text" id="newCategoryName" placeholder="Ex: NMG, Any%" />
          <button onclick="addCategory()">Créer la catégorie</button>
        </div>
      </div>

      <h4 style="margin-top: 20px;">⏳ Runs en attente de vérification</h4>
      <div id="pendingRunsList">Aucune run en attente.</div>
    </div>

    <!-- SOUMETTRE UN CHRONO -->
    <div class="card">
      <h3>🚀 Soumettre un chrono</h3>

      <div id="adminUserSelector" class="hidden" style="background:#0f172a; padding: 10px; border-radius: 8px; margin-bottom: 12px; border: 1px dashed #eab308;">
        <label style="color:#eab308; font-weight:bold;">👑 Soumettre pour le joueur :</label>
        <select id="submitForUser"></select>
        <label style="display:flex; align-items:center; gap:8px; margin-top:8px; cursor:pointer;">
          <input type="checkbox" id="autoValidateCheck" style="width:auto; margin:0;" />
          Valider immédiatement dans le classement (ne pas mettre en attente)
        </label>
      </div>

      <div class="grid-2">
        <div>
          <label>Jeu :</label>
          <select id="runGameSelect" onchange="loadCategoriesForRun()"></select>
        </div>
        <div>
          <label>Catégorie :</label>
          <select id="runCategorySelect"></select>
        </div>
      </div>

      <div class="grid-2" style="margin-top: 10px;">
        <div>
          <label>Temps :</label>
          <input type="text" id="runTime" placeholder="Ex: 04:48.520" />
        </div>
        <div>
          <label>Lien de la preuve :</label>
          <input type="url" id="runProof" placeholder="https://youtube.com/..." />
        </div>
      </div>

      <div style="margin-top: 10px;">
        <label style="font-weight: bold;">Mention spéciale :</label>
        <div class="radio-group">
          <label><input type="radio" name="runTag" value="" checked /> Normal</label>
          <label style="color: #ef4444; font-weight:bold;"><input type="radio" name="runTag" value="WR" /> 🔴 WR (World Record)</label>
          <label style="color: #eab308; font-weight:bold;"><input type="radio" name="runTag" value="BTT" /> 🟡 BTT Segment</label>
        </div>
      </div>

      <button style="margin-top: 12px;" onclick="submitRun()">Envoyer le chrono</button>
      <div id="runMsg" style="margin-top: 8px; font-size: 0.9rem;"></div>
    </div>

    <!-- CLASSEMENT -->
    <div class="card">
      <h3>🏆 Classement officiel</h3>
      <table>
        <thead>
          <tr>
            <th>Tag</th>
            <th>Jeu</th>
            <th>Catégorie</th>
            <th>Joueur</th>
            <th>Temps</th>
            <th>Preuve</th>
          </tr>
        </thead>
        <tbody id="leaderboardBody">
          <tr><td colspan="6">Chargement des scores...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

</div>

<script>
  const SUPABASE_URL = "https://xvienxfcxunlyvejmnzv.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_VBWF6RKzyWLt0L1ANK9dAA_zZofxYi0";
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let currentUser = null;
  let currentProfile = null;
  let allGames = [];
  let allCategories = [];
  let allProfiles = [];

  function pseudoToEmail(pseudo) {
    const clean = pseudo.trim().toLowerCase().replace(/[^a-z0-9_-]/g, '');
    return `${clean}@speedrun.com`;
  }

  async function login() {
    const pseudo = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    const msg = document.getElementById('authMsg');

    if (!pseudo || !password) {
      msg.style.color = '#ef4444';
      msg.innerText = "Champs requis.";
      return;
    }

    const { data, error } = await supabaseClient.auth.signInWithPassword({
      email: pseudoToEmail(pseudo),
      password
    });

    if (error) {
      msg.style.color = '#ef4444';
      msg.innerText = "Pseudo ou mot de passe incorrect.";
    } else {
      currentUser = data.user;
      await initApp();
    }
  }

  async function logout() {
    await supabaseClient.auth.signOut();
    location.reload();
  }

  async function initApp() {
    document.getElementById('authSection').classList.add('hidden');
    document.getElementById('appSection').classList.remove('hidden');

    const { data: profile } = await supabaseClient
      .from('profiles')
      .select('*')
      .eq('id', currentUser.id)
      .single();

    currentProfile = profile || { username: 'Joueur', role: 'player' };

    document.getElementById('userGreeting').innerText = `Bonjour, ${currentProfile.username}`;
    const badge = document.getElementById('userRoleBadge');
    badge.innerText = currentProfile.role.toUpperCase();

    if (currentProfile.role === 'admin') {
      badge.classList.add('badge-admin');
      document.getElementById('adminPanel').classList.remove('hidden');
      document.getElementById('adminUserSelector').classList.remove('hidden');
      await loadProfilesForAdmin();
      loadPendingRuns();
    }

    await loadGamesAndCategories();
    await loadLeaderboard();
  }

  async function loadProfilesForAdmin() {
    const { data: profiles } = await supabaseClient.from('profiles').select('*').order('username');
    allProfiles = profiles || [];
    const select = document.getElementById('submitForUser');
    select.innerHTML = '';
    allProfiles.forEach(p => {
      const selected = p.id === currentUser.id ? 'selected' : '';
      select.innerHTML += `<option value="${p.id}" ${selected}>${p.username}</option>`;
    });
  }

  async function loadGamesAndCategories() {
    const { data: games } = await supabaseClient.from('games').select('*').order('title');
    const { data: categories } = await supabaseClient.from('categories').select('*');

    allGames = games || [];
    allCategories = categories || [];

    const gameSelectAdmin = document.getElementById('gameSelectForCategory');
    const gameSelectRun = document.getElementById('runGameSelect');

    gameSelectAdmin.innerHTML = '';
    gameSelectRun.innerHTML = '<option value="">Sélectionner un jeu</option>';

    allGames.forEach(g => {
      gameSelectAdmin.innerHTML += `<option value="${g.id}">${g.title}</option>`;
      gameSelectRun.innerHTML += `<option value="${g.id}">${g.title}</option>`;
    });

    loadCategoriesForRun();
  }

  function loadCategoriesForRun() {
    const gameId = document.getElementById('runGameSelect').value;
    const catSelect = document.getElementById('runCategorySelect');
    catSelect.innerHTML = '';

    const filtered = allCategories.filter(c => c.game_id == gameId);
    filtered.forEach(c => {
      catSelect.innerHTML += `<option value="${c.id}">${c.name}</option>`;
    });
  }

  async function addGame() {
    const title = document.getElementById('newGameTitle').value.trim();
    if (!title) return;
    await supabaseClient.from('games').insert([{ title }]);
    document.getElementById('newGameTitle').value = '';
    await loadGamesAndCategories();
  }

  async function addCategory() {
    const game_id = document.getElementById('gameSelectForCategory').value;
    const name = document.getElementById('newCategoryName').value.trim();
    if (!game_id || !name) return;
    await supabaseClient.from('categories').insert([{ game_id, name }]);
    document.getElementById('newCategoryName').value = '';
    await loadGamesAndCategories();
  }

  async function submitRun() {
    const category_id = document.getElementById('runCategorySelect').value;
    const rawTime = document.getElementById('runTime').value.trim();
    const proof_url = document.getElementById('runProof').value.trim();
    const msg = document.getElementById('runMsg');
    const selectedTag = document.querySelector('input[name="runTag"]:checked')?.value || null;

    if (!category_id || !rawTime) {
      msg.style.color = '#ef4444';
      msg.innerText = "Sélectionne une catégorie et saisis un chrono.";
      return;
    }

    let targetUserId = currentUser.id;
    let targetStatus = 'pending';

    if (currentProfile.role === 'admin') {
      const adminChosenUser = document.getElementById('submitForUser').value;
      if (adminChosenUser) targetUserId = adminChosenUser;
      if (document.getElementById('autoValidateCheck').checked) {
        targetStatus = 'verified';
      }
    }

    const { error } = await supabaseClient.from('runs').insert([{
      user_id: targetUserId,
      category_id,
      time_seconds: rawTime,
      proof_url,
      status: targetStatus,
      run_tag: selectedTag
    }]);

    if (error) {
      msg.style.color = '#ef4444';
      msg.innerText = error.message;
    } else {
      msg.style.color = '#22c55e';
      msg.innerText = targetStatus === 'verified' ? "Chrono validé et publié !" : "Chrono envoyé ! En attente.";
      document.getElementById('runTime').value = '';
      document.getElementById('runProof').value = '';
      document.querySelector('input[name="runTag"][value=""]').checked = true;
      if (currentProfile.role === 'admin') loadPendingRuns();
      loadLeaderboard();
    }
  }

  async function loadLeaderboard() {
    const { data: runs } = await supabaseClient
      .from('runs')
      .select(`
        id,
        time_seconds,
        proof_url,
        run_tag,
        categories ( name, games ( title ) ),
        profiles ( username )
      `)
      .eq('status', 'verified');

    const tbody = document.getElementById('leaderboardBody');
    tbody.innerHTML = '';

    if (!runs || runs.length === 0) {
      tbody.innerHTML = '<tr><td colspan="6">Aucun chrono validé pour le moment.</td></tr>';
      return;
    }

    runs.forEach(r => {
      let tagBadge = '-';
      let rowClass = '';
      if (r.run_tag === 'WR') {
        tagBadge = '<span class="badge-wr">🔴 WR</span>';
        rowClass = 'row-wr';
      } else if (r.run_tag === 'BTT') {
        tagBadge = '<span class="badge-btt">🟡 BTT</span>';
        rowClass = 'row-btt';
      }

      tbody.innerHTML += `
        <tr class="${rowClass}">
          <td>${tagBadge}</td>
          <td><strong>${r.categories?.games?.title || '-'}</strong></td>
          <td>${r.categories?.name || '-'}</td>
          <td>${r.profiles?.username || 'Anonyme'}</td>
          <td><strong style="font-family:monospace; font-size:1.1rem; letter-spacing: 0.5px;">${r.time_seconds}</strong></td>
          <td>${r.proof_url ? `<a href="${r.proof_url}" target="_blank" style="color:#38bdf8;">Voir vidéo</a>` : '-'}</td>
        </tr>
      `;
    });
  }

  async function loadPendingRuns() {
    const { data: runs } = await supabaseClient
      .from('runs')
      .select(`
        id,
        time_seconds,
        proof_url,
        run_tag,
        categories ( name, games ( title ) ),
        profiles ( username )
      `)
      .eq('status', 'pending');

    const container = document.getElementById('pendingRunsList');
    container.innerHTML = '';

    if (!runs || runs.length === 0) {
      container.innerHTML = '<p style="color:#94a3b8;">Aucune run en attente.</p>';
      return;
    }

    runs.forEach(r => {
      let borderStyle = '#334155';
      let tagBadge = '';
      let blockClass = '';

      if (r.run_tag === 'WR') {
        borderStyle = '#ef4444';
        tagBadge = '<span class="badge-wr">🔴 WR</span>';
        blockClass = 'row-wr';
      } else if (r.run_tag === 'BTT') {
        borderStyle = '#eab308';
        tagBadge = '<span class="badge-btt">🟡 BTT Segment</span>';
        blockClass = 'row-btt';
      }

      container.innerHTML += `
        <div class="${blockClass}" style="background:#0f172a; border-left: 5px solid ${borderStyle}; padding:12px; border-radius:6px; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center;">
          <div>
            ${tagBadge ? tagBadge + ' ' : ''}
            <strong>${r.profiles?.username}</strong> — ${r.categories?.games?.title} (${r.categories?.name}) : 
            <strong style="color:#38bdf8; font-family:monospace; font-size:1.1rem;">${r.time_seconds}</strong>
            ${r.proof_url ? ` | <a href="${r.proof_url}" target="_blank" style="color:#38bdf8;">📺 Lien vidéo</a>` : ''}
          </div>
          <div style="display:flex; gap:8px;">
            <button class="btn-success" onclick="updateRunStatus(${r.id}, 'verified')">✅ Valider</button>
            <button class="btn-danger" onclick="updateRunStatus(${r.id}, 'rejected')">❌ Rejeter</button>
          </div>
        </div>
      `;
    });
  }

  async function updateRunStatus(runId, status) {
    await supabaseClient.from('runs').update({ status }).eq('id', runId);
    loadPendingRuns();
    loadLeaderboard();
  }
</script>
</body>
</html>
